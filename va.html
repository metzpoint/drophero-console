<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://esm.sh; style-src 'unsafe-inline'; connect-src https://aexomkitwnxvpqlmtrik.supabase.co wss://aexomkitwnxvpqlmtrik.supabase.co https://esm.sh; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>DropHero — VA</title>
<style>
  :root{--bg:#0b0f14;--card:#151b24;--line:#232c39;--ink:#e8edf5;--dim:#8b98ab;
        --ok:#3ddc97;--warn:#ffb454;--bad:#ff6b6b;--accent:#6aa6ff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{overflow-x:hidden;max-width:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
       padding:max(12px,env(safe-area-inset-top)) 12px calc(30px + env(safe-area-inset-bottom))}
  h1{font-size:19px;margin:4px 0 2px}
  .sub{color:var(--dim);font-size:12px;margin:0 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
        margin-bottom:11px;min-width:0;overflow-wrap:anywhere}
  .top{border-color:#2b4a7d}
  .who{font-size:20px;font-weight:650;line-height:1.2} .meta{color:var(--dim);font-size:12px;margin-top:4px}
  .pill{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);
        color:var(--dim);white-space:nowrap}
  .HIGH{color:var(--ok);border-color:#1e5e46} .MEDIUM{color:var(--warn);border-color:#5e4620}
  a.open{display:block;text-align:center;background:#1d3050;border:1px solid #2b4a7d;color:#cfe0ff;
         border-radius:11px;padding:15px;margin:13px 0;text-decoration:none;font-weight:650;
         font-size:17px;min-height:52px}
  /* The one action a VA takes on every card, so it is the biggest thing on the screen. */
  a.open.primary{background:#1e5e46;border-color:#2b7d5f;color:#eafff5;padding:18px;
         font-size:18px;min-height:58px;margin-bottom:6px}
  .script{background:#10161e;border:1px solid var(--line);border-radius:11px;padding:12px;
          white-space:pre-wrap;font-size:14px;line-height:1.5;margin:11px 0}
  .acts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .acts .full{grid-column:1/-1}
  button{font:inherit;background:#1d2836;color:var(--ink);border:1px solid var(--line);
         border-radius:11px;padding:12px;min-height:48px;cursor:pointer;width:100%}
  button.good{background:#173d2e;border-color:#1e5e46;color:#b6f0d5}
  button.bad{background:#3a1d1d;border-color:#5e2020;color:#ffc9c9}
  button.sm{min-height:38px;padding:8px;font-size:13px}
  input,textarea{font:inherit;background:#10161e;color:var(--ink);border:1px solid var(--line);
         border-radius:11px;padding:11px;min-height:44px;width:100%;max-width:100%}
  textarea{min-height:64px}
  .muted{color:var(--dim);font-size:12px}
  /* Three tabs, thumb-sized, stuck to the top: on a phone the VA is scrolling a list and still has
     to be able to switch view without hunting for the top of the page. */
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;position:sticky;top:0;z-index:5;
        background:var(--bg);padding:8px 0 10px;margin-bottom:4px}
  .tab{font:inherit;background:#161d27;color:var(--dim);border:1px solid var(--line);
       border-radius:11px;padding:10px 4px;min-height:52px;cursor:pointer;width:100%;
       font-size:12px;line-height:1.25}
  .tab b{display:block;font-size:16px;color:var(--ink);font-weight:650}
  .tab[aria-selected="true"]{background:#1d3050;border-color:#2b4a7d;color:#cfe0ff}
  .tab[aria-selected="true"] b{color:#eaf2ff}
  /* Every row in the two history views is itself a card, so a long list stays scannable. */
  .row{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;
       margin-bottom:10px}
  .row .who{font-size:17px}
  .badge{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);
         display:inline-block;margin-top:6px;color:var(--dim)}
  .badge.warm{background:#173d2e;border-color:#1e5e46;color:#b6f0d5}
  .badge.cold{background:#3a1d1d;border-color:#5e2020;color:#ffc9c9}
  .badge.due{background:#4a3410;border-color:#7d5a1e;color:#ffe2ac}
  details.prev{margin:10px 0}
  details.prev summary{cursor:pointer;color:var(--dim);font-size:12px;padding:6px 0;
                       min-height:32px}
  .quote{background:#0e1620;border-left:3px solid #2b4a7d;border-radius:0 9px 9px 0;
         padding:9px 11px;margin:8px 0;font-size:13px;white-space:pre-wrap;line-height:1.5}
  .counts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
  .counts div{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px;
              text-align:center}
  .counts b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}
  .counts span{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  #login{max-width:400px;margin:11vh auto}
  .warn{background:#3a2318;border:1px solid #6b3a1f;color:#ffcf9e;padding:12px;border-radius:11px;
        font-size:13px;margin:11px 0}
</style></head><body>

<div id="login" hidden>
  <h1>DropHero</h1><p class="sub">VA sign in.</p>
  <div class="card">
    <p class="muted">Email</p><input id="email" type="email" autocomplete="username" inputmode="email">
    <p class="muted" style="margin-top:11px">Password</p>
    <input id="pw" type="password" autocomplete="current-password">
    <div class="acts" style="margin-top:13px">
      <button id="signin" class="full">Sign in</button>
    </div>
    <p id="loginmsg" class="muted" style="margin-bottom:0"></p>
  </div>
  <p class="muted">First time? Open the invitation link your manager sent you — that is where you
    choose your password.</p>
</div>

<div id="claim" hidden>
  <h1>DropHero</h1><p class="sub">Set up your account.</p>
  <div class="card">
    <p class="muted">You were invited as</p>
    <p class="who" id="claimemail" style="font-size:16px">…</p>
    <p class="muted" style="margin-top:13px">Choose a password</p>
    <input id="claimpw" type="password" autocomplete="new-password">
    <p class="muted" style="margin-top:11px">Repeat it</p>
    <input id="claimpw2" type="password" autocomplete="new-password">
    <div class="acts" style="margin-top:13px">
      <button id="claimgo" class="good full">Create my account</button>
    </div>
    <p id="claimmsg" class="muted" style="margin-bottom:0"></p>
  </div>
</div>

<main id="app" hidden>
  <h1 id="hello">DropHero</h1>
  <p class="sub" id="sub">loading…</p>

  <div class="counts">
    <div><b id="remaining">–</b><span>Left today</span></div>
    <div><b id="done">–</b><span>Done today</span></div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" id="tab-new"  role="tab" aria-selected="true"
            data-tab="new"><b id="n-new">–</b>New DMs</button>
    <button class="tab" id="tab-rep"  role="tab" aria-selected="false"
            data-tab="rep"><b id="n-rep">–</b>Check replies</button>
    <button class="tab" id="tab-conv" role="tab" aria-selected="false"
            data-tab="conv"><b id="n-conv">–</b>Conversations</button>
  </div>

  <div id="card"></div>
  <div id="list" hidden></div>

  <div class="acts" style="margin-top:22px">
    <button id="changepw">Change password</button>
    <button id="signout">Sign out</button>
  </div>
</main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';
const sb = createClient('https://aexomkitwnxvpqlmtrik.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFleG9ta2l0d254dnBxbG10cmlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MzEzMjQsImV4cCI6MjEwMjIwNzMyNH0.RPmcFB1YFzBGGuRLWJAZUYZXiKB1ILh9FFIie_EbFkQ',
  { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let queue = [];       // NEW DMS only: creators nobody has written to yet
let cursor = 0;       // which one is on screen
let view = {};        // the whole three-part payload from dh_va_queue
let tab = 'new';      // 'new' | 'rep' | 'conv'
// results === null means "no search running, show the normal conversations list". An empty array
// means the search ran and matched nothing, which is a different thing to say on screen.
const search = { q: '', results: null, timer: 0, focused: false };

$('signin').onclick = async () => {
  $('loginmsg').textContent = 'signing in…';
  const { error } = await sb.auth.signInWithPassword(
    { email: $('email').value.trim(), password: $('pw').value });
  $('loginmsg').textContent = error ? error.message : '';
  if (!error) boot();
};

// ---------------------------------------------------------------------------------------------
// CLAIMING AN INVITATION. The link carries a single-use code; the VA supplies only a password.
// The account is created already confirmed, so there is no mail to wait for and no redirect to get
// lost in -- which matters because this project's Site URL still points somewhere that does not
// resolve, and a VA who lands there cannot tell a working signup from a broken one.
// ---------------------------------------------------------------------------------------------
const INVITE = new URLSearchParams(location.search).get('invite');

async function claimEndpoint(payload) {
  const res = await fetch('https://aexomkitwnxvpqlmtrik.supabase.co/functions/v1/claim-invite', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify(payload)
  });
  return { ok: res.ok, body: await res.json().catch(() => ({ error: 'no answer from the server' })) };
}

async function offerClaim() {
  const { ok, body } = await claimEndpoint({ code: INVITE, check: true });
  if (!ok) { $('login').hidden = false; $('loginmsg').textContent = body.error; return; }
  $('claim').hidden = false;
  $('claimemail').textContent = body.email;
}

$('claimgo').onclick = async () => {
  const pw = $('claimpw').value;
  if (pw.length < 8) { $('claimmsg').textContent = 'At least 8 characters, please.'; return; }
  if (pw !== $('claimpw2').value) { $('claimmsg').textContent = 'The two passwords differ.'; return; }
  $('claimgo').disabled = true;
  $('claimmsg').textContent = 'creating your account…';

  const { ok, body } = await claimEndpoint({ code: INVITE, password: pw });
  if (!ok) { $('claimmsg').textContent = body.error; $('claimgo').disabled = false; return; }

  // Straight in. Signing in here rather than asking them to type it all again is the whole point.
  const { error } = await sb.auth.signInWithPassword({ email: body.email, password: pw });
  if (error) {
    $('claim').hidden = true; $('login').hidden = false;
    $('loginmsg').textContent = 'Your account is ready. Sign in with ' + body.email + '.';
    return;
  }
  history.replaceState(null, '', location.pathname);   // do not leave a used code in the address bar
  $('claim').hidden = true;
  boot();
};

$('signout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

// A VA's first password was chosen by whoever created their account, so they get a way to replace
// it. Password reset by email is not an option here: the confirmation redirect on this project
// points at a Site URL that does not resolve, and a reset link that lands nowhere is worse than no
// reset link at all.
$('changepw').onclick = async () => {
  const pw = prompt('New password — at least 8 characters.');
  if (pw === null) return;
  if (pw.length < 8) { alert('That is too short.'); return; }
  const { error } = await sb.auth.updateUser({ password: pw });
  alert(error ? error.message : 'Password changed. Use it the next time you sign in.');
};

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    $('app').hidden = true;
    // An invitation link takes precedence over the sign-in form: someone arriving with one has no
    // account yet, and showing them a password box they cannot use is how people give up.
    if (INVITE) { await offerClaim(); } else { $('login').hidden = false; }
    return;
  }
  $('claim').hidden = true;
  const { data, error } = await sb.rpc('dh_va_queue');
  if (error) {
    // TWO VERY DIFFERENT FAILURES USED TO SHOW THE SAME SENTENCE. Any error here was reported as
    // "not set up as a VA yet" -- so when a bug in the query made every call fail, a VA with a
    // correct password was told their account was wrong. Sign-in had worked perfectly; the message
    // sent them to look in the one place that was fine. Only the specific "no VA is linked"
    // exception means the wrong door; anything else is a fault and says so.
    $('login').hidden = false; $('app').hidden = true;
    $('loginmsg').textContent = /no va is linked/i.test(error.message || '')
      ? 'This account is not set up as a VA yet.'
      : 'Signed in, but the queue could not be loaded — this is a fault on our side, not your '
        + 'account. Please tell Rico. (' + (error.message || 'unknown error') + ')';
    return;
  }
  $('login').hidden = true; $('app').hidden = false;
  view = data;
  queue = data.new_dms || [];
  cursor = Math.min(cursor, Math.max(0, queue.length - 1));
  $('hello').textContent = 'Hi ' + ((data.va && data.va.name) || '');
  $('sub').textContent = queue.length ? queue.length + ' creators waiting for a first DM'
                                      : 'no new creators right now';
  $('remaining').textContent = data.remaining_today ?? 0;
  $('done').textContent = data.completed_today ?? 0;
  $('n-new').textContent  = queue.length;
  $('n-rep').textContent  = (data.check_replies || []).length;
  $('n-conv').textContent = (data.conversations || []).length;
  render();
}

// ---------------------------------------------------------------------------------------------
// TIME, THE WAY SOMEONE WORKING A QUEUE READS IT. "3d ago" answers "is this worth checking yet";
// a timestamp does not, and on a phone it costs a line of screen to say less.
// ---------------------------------------------------------------------------------------------
function ago(iso) {
  if (!iso) return '';
  const secs = (Date.now() - new Date(iso).getTime()) / 1000;
  const future = secs < 0;
  const s = Math.abs(secs);
  const n = s < 3600 ? Math.max(1, Math.round(s / 60)) + 'm'
          : s < 86400 ? Math.round(s / 3600) + 'h'
          : Math.round(s / 86400) + 'd';
  return future ? 'in ' + n : n + ' ago';
}

function when(iso) {
  if (!iso) return 'unknown';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' })
       + ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}

const STATUS_LABEL = {
  NO_REPLY: 'No reply yet', REPLIED: 'Replied', INTERESTED: 'Interested',
  NOT_INTERESTED: 'Not interested', FOLLOW_UP_LATER: 'Follow up later', UNREACHABLE: "Can't reach"
};

function badgeFor(t) {
  const s = t.reply_status;
  if (!s) return '<span class="badge">Sent, not checked</span>';
  const cls = s === 'INTERESTED' || s === 'REPLIED' ? 'warm'
            : s === 'NOT_INTERESTED' || s === 'UNREACHABLE' ? 'cold'
            : s === 'FOLLOW_UP_LATER' ? 'due' : '';
  return '<span class="badge ' + cls + '">' + esc(STATUS_LABEL[s] || s) + '</span>';
}

/** Confirmation under the primary action, cleared on the next card. */
function say(text) {
  const el = $('copystate');
  if (el) el.textContent = text || ' ';
}

/**
 * Copy without awaiting, so the tap that triggered it can still navigate.
 *
 * navigator.clipboard.writeText returns a promise, but the write is authorised at the moment it is
 * CALLED, inside the gesture -- so it is started and deliberately not awaited. Awaiting it before
 * the anchor navigates is what makes Safari treat the navigation as a popup and block it.
 *
 * The execCommand path is the fallback for anything older or any context where the async API is
 * missing. On iOS it needs a real selection range, not just .select(), which is why the range is
 * built by hand.
 */
function copyNow(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => legacyCopy(text));
      return true;
    }
  } catch { /* fall through to the old way */ }
  return legacyCopy(text);
}

function legacyCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.contentEditable = 'true';
  ta.readOnly = false;
  // Off-screen but not display:none -- a hidden element cannot be selected, and iOS scrolls to a
  // focused field, so it is parked at the current scroll position rather than at the top.
  ta.style.cssText = 'position:fixed;left:-9999px;top:' + window.scrollY + 'px;opacity:0';
  document.body.appendChild(ta);
  let ok = false;
  try {
    const range = document.createRange();
    range.selectNodeContents(ta);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    ta.setSelectionRange(0, text.length);
    ok = document.execCommand('copy');
  } catch { ok = false; }
  document.body.removeChild(ta);
  return ok;
}

// ---------------------------------------------------------------------------------------------
// ONE CARD. Finishing a lead advances to the next immediately -- the VA never returns to a list to
// choose, which is what makes the queue actually get worked from the top.
// ---------------------------------------------------------------------------------------------
/** Which of the three views is on screen. Only the first is a one-card-at-a-time queue. */
function render() {
  for (const b of document.querySelectorAll('.tab')) {
    b.setAttribute('aria-selected', String(b.dataset.tab === tab));
  }
  $('card').hidden = tab !== 'new';
  $('list').hidden = tab === 'new';
  if (tab === 'new') { draw(); return; }
  if (tab === 'rep') { drawReplies(); return; }
  drawConversations();
}

// ---------------------------------------------------------------------------------------------
// CHECK REPLIES. Everyone this VA has written to and not yet heard an outcome from, oldest check
// due first -- so working top-down is the same as working the ones that have waited longest.
// ---------------------------------------------------------------------------------------------
/** Oldest due first. Whatever is due soonest has waited longest, so the top of the list is the
 *  right place to start work. */
function byDue(a, b) {
  const at = new Date(a.follow_up_at || a.last_checked_at || a.first_sent_at || 0).getTime();
  const bt = new Date(b.follow_up_at || b.last_checked_at || b.first_sent_at || 0).getTime();
  return at - bt;
}

function drawReplies() {
  // dh_va_queue already returns these in order, and the page sorts them again anyway: the ordering
  // is a promise this view makes to the VA, and it should not quietly depend on which query the
  // rows arrived from. dh_va_search returns the same shape ordered by recency, not by due date.
  const rows = (view.check_replies || []).slice().sort(byDue);
  if (!rows.length) {
    $('list').innerHTML = '<div class="card"><div class="who">Nothing to check</div>'
      + '<p class="muted">Creators appear here after you mark a DM as sent.</p></div>';
    return;
  }
  $('list').innerHTML =
    '<p class="muted" style="margin:0 0 10px">' + rows.length
    + ' sent, waiting on a reply. Oldest first.</p>'
    + rows.map((t) => rowHtml(t, { due: true })).join('');
  wireRows(rows);
}

// ---------------------------------------------------------------------------------------------
// CONVERSATIONS. Anyone who answered or is being followed up, plus a search that reaches every
// creator this VA has ever written to -- including the ones past the page limit and the ones marked
// unreachable, because "can't reach" is often wrong and they answer a week later.
// ---------------------------------------------------------------------------------------------
function drawConversations() {
  const rows = search.results !== null ? search.results : (view.conversations || []);
  const box = '<input id="q" type="search" placeholder="Search name or handle"'
            + ' value="' + esc(search.q) + '" autocomplete="off" style="margin-bottom:12px">';
  const body = rows.length
    ? '<p class="muted" style="margin:0 0 10px">' + rows.length
      + (search.results !== null ? ' found' : ' conversations') + '</p>'
      + rows.map((t) => rowHtml(t, { due: false })).join('')
    : '<div class="card"><div class="who">'
      + (search.results !== null ? 'No match' : 'No conversations yet')
      + '</div><p class="muted">'
      + (search.results !== null
          ? 'Search looks at every creator you have written to, by name or handle.'
          : 'Creators appear here once you record a reply or set a follow-up.')
      + '</p></div>';
  $('list').innerHTML = box + body;

  const q = $('q');
  // Focus is restored by hand because the input is re-created on every keystroke; without this the
  // keyboard closes after one character.
  if (search.focused) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  q.oninput = () => {
    search.q = q.value; search.focused = true;
    clearTimeout(search.timer);
    search.timer = setTimeout(runSearch, 250);
  };
  wireRows(rows);
}

async function runSearch() {
  const q = search.q.trim();
  if (q.length < 2) { search.results = null; drawConversations(); return; }
  const { data, error } = await sb.rpc('dh_va_search', { p_q: q });
  search.results = error ? [] : (data || []);
  drawConversations();
}

/**
 * One creator in a history view. Everything the VA needs to answer a reply without leaving the
 * page: who they are, when the DM went out, exactly what was sent, whatever they wrote back, and
 * a profile link that is always present -- a conversation you cannot open is not much use.
 */
function rowHtml(t, opts) {
  const due = t.follow_up_at || t.last_checked_at || t.first_sent_at;
  return '<div class="row" data-task="' + esc(t.task_id) + '">'
    + '<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">'
      + '<div><div class="who">' + esc(t.display_name || t.handle || 'creator') + '</div>'
      + '<div class="meta">' + esc(t.handle ? '@' + t.handle : '') + ' · ' + esc(t.platform) + '</div>'
      + badgeFor(t) + '</div>'
      + '<span class="pill ' + esc(t.priority) + '">' + esc(t.priority) + '</span></div>'
    + '<p class="muted" style="margin:10px 0 0">Sent ' + esc(when(t.first_sent_at))
      + ' (' + esc(ago(t.first_sent_at)) + ')'
      + (t.last_checked_at ? ' · last checked ' + esc(ago(t.last_checked_at)) : '')
      + (t.follow_up_at ? ' · follow up ' + esc(ago(t.follow_up_at)) : '')
      + (opts.due && due ? '' : '') + '</p>'
    + '<details class="prev"><summary>Show the DM that was sent</summary>'
      + '<div class="script">' + esc(t.dm_message || '(no message stored)') + '</div></details>'
    + (Array.isArray(t.replies) && t.replies.length
        ? t.replies.map((r) => '<div class="quote">' + esc(r.text)
            + '<div class="muted" style="margin-top:6px">pasted ' + esc(ago(r.at)) + '</div></div>').join('')
        : '')
    + '<a class="open" href="' + esc(t.profile_url) + '" target="_blank" rel="noopener">Open profile</a>'
    + '<button class="sm" data-copy="1" style="margin-bottom:10px">Copy DM again</button>'
    + '<p class="muted" style="margin:4px 0 5px">Paste their reply (optional)</p>'
    + '<textarea data-reply="1" placeholder="What they wrote back"></textarea>'
    + '<p class="muted" style="margin:10px 0 5px">Note (optional)</p>'
    + '<textarea data-note="1">' + esc(t.notes || '') + '</textarea>'
    + '<div class="acts" style="margin-top:11px">'
      + '<button class="good" data-s="REPLIED">Replied</button>'
      + '<button data-s="NO_REPLY">No reply</button>'
      + '<button class="good" data-s="INTERESTED">Interested</button>'
      + '<button class="bad" data-s="NOT_INTERESTED">Not interested</button>'
      + '<button data-s="FOLLOW_UP_LATER">Follow up later</button>'
      + '<button class="bad" data-s="UNREACHABLE">Can\'t reach</button>'
    + '</div></div>';
}

function wireRows(rows) {
  const byId = new Map(rows.map((r) => [r.task_id, r]));
  for (const el of $('list').querySelectorAll('.row')) {
    const t = byId.get(el.dataset.task);
    if (!t) continue;
    const copyBtn = el.querySelector('button[data-copy]');
    copyBtn.onclick = () => {
      copyBtn.textContent = copyNow(t.dm_message) ? 'Copied' : 'Select the text above';
    };
    for (const b of el.querySelectorAll('button[data-s]')) {
      b.onclick = async () => {
        for (const o of el.querySelectorAll('button[data-s]')) o.disabled = true;
        const { error } = await sb.rpc('dh_va_update_task', {
          p_task_id: t.task_id,
          p_status: b.dataset.s,
          p_notes: el.querySelector('textarea[data-note]').value.trim() || null,
          p_reply_text: el.querySelector('textarea[data-reply]').value.trim() || null
        });
        if (error) {
          alert(error.message);
          for (const o of el.querySelectorAll('button[data-s]')) o.disabled = false;
          return;
        }
        // A search result set is rebuilt from the server too, so a creator whose status just
        // changed shows their new state rather than the one that was on screen.
        if (search.results !== null) await runSearch();
        boot();
      };
    }
  }
}

function draw() {
  const t = queue[cursor];
  if (!t) {
    $('card').innerHTML = '<div class="card"><div class="who">All caught up</div>'
      + '<p class="muted">No new creators to write to. Anyone you have already messaged is under '
      + 'Check replies and Conversations.</p></div>';
    return;
  }
  $('card').innerHTML =
    '<div class="card top">'
    + '<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">'
      + '<div><div class="who">' + esc(t.display_name || t.handle || 'creator') + '</div>'
      + '<div class="meta">' + esc(t.handle ? '@' + t.handle : '') + ' · ' + esc(t.platform) + '</div></div>'
      + '<span class="pill ' + esc(t.priority) + '">' + esc(t.priority) + '</span></div>'
    + '<p class="muted" style="margin:13px 0 5px">Personalized message</p>'
    + '<div class="script" id="script">' + esc(t.dm_message) + '</div>'
    // THE PRIMARY ACTION IS AN ANCHOR, NOT A BUTTON, AND THAT IS THE WHOLE TRICK ON IOS.
    // Tapping a real link to https://www.tiktok.com/@handle lets iOS hand off to the TikTok app
    // through its universal link; if the app is not installed, Safari simply loads the web profile,
    // so the fallback costs no code. window.open() would be a popup, and Safari blocks popups that
    // happen after any await -- which is exactly what copying is.
    + '<a class="open primary" id="copyopen" href="' + esc(t.profile_url) + '"'
      + ' target="_blank" rel="noopener">Copy DM &amp; open profile</a>'
    + '<p class="muted" id="copystate" style="margin:-4px 0 10px;text-align:center">&nbsp;</p>'
    + '<button class="sm" id="copy">Copy DM</button>'
    + '<p class="muted" style="margin:13px 0 5px">Note (optional)</p>'
    + '<textarea id="note" placeholder="Anything worth remembering">' + esc(t.notes || '') + '</textarea>'
    // Only the two outcomes that can genuinely happen before a DM exists. Replied, Interested and
    // the rest moved to Check replies, where the reply box is -- offering them here invited a VA to
    // record an answer to a message they had not sent yet, and cost the outcome its reply text.
    + '<div class="acts" style="margin-top:12px">'
      + '<button class="good full" data-s="CONTACTED">Sent DM</button>'
      + '<button class="bad full" data-s="UNREACHABLE">Can\'t reach this profile</button>'
    + '</div>'
    + '<p class="muted" style="margin:10px 0 0">After you send, they move to '
      + '<b>Check replies</b> so you can come back when they answer.</p>'
    + '<p class="muted" style="margin-bottom:0">' + (cursor + 1) + ' of ' + queue.length + '</p>'
    + '</div>';

  // COPY, CONFIRM, THEN LET THE LINK DO ITS JOB -- in that order, with nothing awaited in between.
  // Safari treats the tap as a user gesture only for the synchronous part of the handler; the
  // moment you await the clipboard promise before navigating, the navigation is a popup and gets
  // blocked. So the copy is only STARTED here and the anchor's own default action carries on.
  // Nothing here changes the task: the VA still taps Sent DM after they have actually sent it.
  $('copyopen').addEventListener('click', () => {
    const ok = copyNow(t.dm_message);
    say(ok ? 'Copied — paste it in the DM' : 'Copy failed, select the message above');
  });

  $('copy').onclick = () => {
    const ok = copyNow(t.dm_message);
    $('copy').textContent = ok ? 'Copied' : 'Select the text above to copy';
    say(ok ? 'Copied' : '');
  };

  for (const b of $('card').querySelectorAll('button[data-s]')) {
    b.onclick = async () => {
      for (const o of $('card').querySelectorAll('button[data-s]')) o.disabled = true;
      const { error } = await sb.rpc('dh_va_update_task',
        { p_task_id: t.task_id, p_status: b.dataset.s, p_notes: $('note').value.trim() || null });
      if (error) {
        alert(error.message);
        for (const o of $('card').querySelectorAll('button[data-s]')) o.disabled = false;
        return;
      }
      // Straight to the next lead. boot() re-reads the queue so a status that removes the lead
      // (not interested, unreachable) drops it, clamps the cursor to what is left, and moves both
      // counters at the same time.
      cursor = cursor + 1;
      boot();
    };
  }
}

for (const b of document.querySelectorAll('.tab')) {
  b.onclick = () => {
    tab = b.dataset.tab;
    // Leaving Conversations drops the search, so coming back shows the real list rather than a
    // stale result set from a query the VA has forgotten they typed.
    if (tab !== 'conv') { search.q = ''; search.results = null; search.focused = false; }
    render();
  };
}

// The 30s refresh must not yank the ground from under someone mid-typing: a VA writing a note or
// pasting a reply would lose it when the list re-rendered. Polling pauses while a field has focus.
function typing() {
  const a = document.activeElement;
  return a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT');
}
setInterval(() => { if (!document.hidden && !$('app').hidden && !typing()) boot(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) boot(); });
boot();
</script></body></html>
