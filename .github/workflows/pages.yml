# Publish the two console pages to GitHub Pages.
#
# Supabase rewrites Content-Type to text/plain on its shared *.supabase.co domain, for Storage as
# well as for Edge Functions, so the dashboard could not render there. This repository exists only
# to serve the same HTML from an origin that does not rewrite it.
#
# `enablement: true` turns Pages on the first time this runs, so nobody has to click through
# repository settings.
name: Publish console

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
